<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#222638" />
      <stop offset="50%" stop-color="#12131A" />
      <stop offset="100%" stop-color="#070709" />
    </radialGradient>
    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="70%" stop-color="rgba(100,120,160,0.3)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glassBlur">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Deep Obsidian Graphite Background with Rounded Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="118" fill="none" stroke="url(#specularBorder)" stroke-width="2.5" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="200" r="140" fill="url(#accentGlow)" opacity="0.18" filter="url(#glassBlur)" />

  <!-- TV Outline (Glass Panel) -->
  <rect x="110" y="110" width="292" height="186" rx="28" fill="url(#glassFill)" stroke="url(#specularBorder)" stroke-width="3" />
  <rect x="236" y="298" width="40" height="34" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <rect x="196" y="332" width="120" height="10" rx="5" fill="rgba(255,255,255,0.15)" />

  <!-- Phone Outline Overlaying the TV (Liquid Glass Cast Concept) -->
  <g transform="translate(40, 20)">
    <rect x="230" y="190" width="130" height="230" rx="26" fill="#12141F" stroke="url(#specularBorder)" stroke-width="3.5" />
    <!-- Phone Screen with Glow -->
    <rect x="240" y="208" width="110" height="194" rx="18" fill="url(#glassFill)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    <!-- Dynamic Cast Waves -->
    <path d="M 270 330 A 25 25 0 0 1 295 355" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" />
    <path d="M 270 310 A 45 45 0 0 1 315 355" fill="none" stroke="#93C5FD" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 1" />
    <circle cx="270" cy="355" r="5" fill="#60A5FA" />
  </g>

  <!-- Play Symbol inside TV -->
  <polygon points="215,175 275,205 215,235" fill="url(#accentGlow)" opacity="0.9" />
</svg>
